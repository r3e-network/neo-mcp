name: Promote Existing Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release version to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote validated release channels
    runs-on: ubuntu-latest
    concurrency:
      group: neo-mcp-release-promotion
      cancel-in-progress: false
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/neo-mcp
      PACKAGE_NAME: '@r3e/neo-mcp'
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Validate immutable release inputs
        id: release
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable semantic versions can be promoted." >&2
            exit 1
          fi
          version_major="${BASH_REMATCH[1]}"
          version_major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          tag="v${PACKAGE_VERSION}"
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null

          npm_version="$(npm view --silent "$PACKAGE_NAME" dist-tags.latest)"
          if [[ "$npm_version" != "$PACKAGE_VERSION" ]]; then
            echo "npm latest points to ${npm_version}, not ${PACKAGE_VERSION}." >&2
            exit 1
          fi

          image_ref="${IMAGE_REPOSITORY}:${PACKAGE_VERSION}"
          docker buildx imagetools inspect "$image_ref" >/dev/null
          docker pull "$image_ref" >/dev/null
          image_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image_ref")"
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
          tag_revision="$(git rev-list -n 1 "$tag")"
          if [[ "$image_version" != "$PACKAGE_VERSION" || "$image_revision" != "$tag_revision" ]]; then
            echo "Versioned image provenance does not match ${tag}." >&2
            exit 1
          fi

          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image_ref")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Registry returned an invalid image digest." >&2
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "major=$version_major"
            echo "major-minor=$version_major_minor"
          } >> "$GITHUB_OUTPUT"
      - name: Promote stable Docker aliases
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
          VERSION_MAJOR: ${{ steps.release.outputs.major }}
          VERSION_MAJOR_MINOR: ${{ steps.release.outputs.major-minor }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:latest" \
            --tag "${IMAGE_REPOSITORY}:${VERSION_MAJOR_MINOR}" \
            --tag "${IMAGE_REPOSITORY}:${VERSION_MAJOR}" \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          for alias in latest "$VERSION_MAJOR_MINOR" "$VERSION_MAJOR"; do
            alias_digest="$(
              docker buildx imagetools inspect \
                --format '{{.Manifest.Digest}}' "${IMAGE_REPOSITORY}:${alias}"
            )"
            if [[ "$alias_digest" != "$IMAGE_DIGEST" ]]; then
              echo "Docker alias ${alias} does not resolve to ${IMAGE_DIGEST}." >&2
              exit 1
            fi
          done
