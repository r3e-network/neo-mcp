name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run type checking
        run: npm run type-check
      - name: Run unit tests
        run: npm run test:unit -- --runInBand
      - name: Generate coverage
        if: matrix.node-version == '22.x'
        run: npm run test:coverage -- --runInBand

  build:
    name: Build and package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Validate build artifacts
        run: test -f dist/index.js && test -f dist/http.js && test -f dist/index.d.ts
      - name: Run deterministic MCP tests
        run: npm run test:mcp
      - name: Pack validated package artifact
        run: |
          set -euo pipefail
          mkdir release-artifact
          npm pack --json --pack-destination release-artifact > release-artifact/pack.json
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const metadata = JSON.parse(fs.readFileSync('release-artifact/pack.json', 'utf8'));
          if (metadata.length !== 1 || !metadata[0].filename || !metadata[0].integrity) {
            throw new Error('npm pack did not describe exactly one package artifact');
          }
          if (!fs.existsSync(path.join('release-artifact', metadata[0].filename))) {
            throw new Error(`npm pack artifact is missing: ${metadata[0].filename}`);
          }
          NODE
      - name: Upload package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package-artifact
          path: release-artifact
          if-no-files-found: error
          retention-days: 1

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Container validation
    runs-on: ubuntu-latest
    needs: [test, build, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Validate Compose files
        env:
          HTTP_API_KEY: ci-only-api-key-0000000000000000
          MCP_HTTP_BEARER: ci-only-mcp-bearer-00000000000000
          NEO_MCP_IMAGE_REPOSITORY: r3enetwork/neo-mcp
          NEO_MCP_IMAGE_DIGEST: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          if [[ ! "$NEO_MCP_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Registry Compose validation requires a 64-character lowercase hexadecimal digest" >&2
            exit 1
          fi
          docker compose -f docker/docker-compose.yml config
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.registry.yml config
          docker compose -f docker/docker-compose.dev.yml config
      - name: Build development image
        run: docker build -f docker/Dockerfile.dev -t neo-mcp:dev .
      - name: Build production image
        run: docker build -f docker/Dockerfile -t neo-mcp:latest .
      - name: Check production image health
        run: |
          docker run --detach --name neo-mcp-ci \
            --env NEO_NETWORK=testnet \
            --env HTTP_API_KEY=ci-only-api-key-0000000000000000 \
            neo-mcp:latest
          trap 'docker logs neo-mcp-ci; docker rm --force neo-mcp-ci' EXIT
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' neo-mcp-ci)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && exit 1
            sleep 1
          done
          exit 1

  release-gate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    needs: [test, build, security, docker]
    if: github.event_name == 'release'
    outputs:
      is-prerelease: ${{ steps.release.outputs.is-prerelease }}
      npm-dist-tag: ${{ steps.release.outputs.npm-dist-tag }}
      package-name: ${{ steps.release.outputs.package-name }}
      version: ${{ steps.release.outputs.version }}
      version-major: ${{ steps.release.outputs.version-major }}
      version-major-minor: ${{ steps.release.outputs.version-major-minor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
      - name: Validate tag and select publication channels
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          NORMALIZED_RELEASE_TAG="${RELEASE_TAG#v}"
          if [[ "$NORMALIZED_RELEASE_TAG" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match package version '$PACKAGE_VERSION'." >&2
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" == *+* ]]; then
            echo "Package versions with build metadata cannot be published as Docker tags." >&2
            exit 1
          fi
          SEMVER_COMPONENTS="$(
            node - "$PACKAGE_VERSION" <<'NODE'
          const version = process.argv[2];
          const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
          const match = pattern.exec(version);
          if (!match) {
            console.error(`Package version '${version}' is not a canonical semantic version.`);
            process.exit(1);
          }
          process.stdout.write(
            [match[1], match[2], match[4] === undefined ? 'false' : 'true'].join('\t')
          );
          NODE
          )"
          IFS=$'\t' read -r VERSION_MAJOR VERSION_MINOR VERSION_IS_PRERELEASE \
            <<< "$SEMVER_COMPONENTS"
          if (( ${#PACKAGE_VERSION} > 128 )) || [[ ! "$PACKAGE_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
            echo "Package version '$PACKAGE_VERSION' is not a valid Docker tag." >&2
            exit 1
          fi

          if [[ "$RELEASE_PRERELEASE" != "$VERSION_IS_PRERELEASE" ]]; then
            echo "GitHub prerelease status does not match package version '$PACKAGE_VERSION'." >&2
            exit 1
          fi

          if [[ "$VERSION_IS_PRERELEASE" == true ]]; then
            NPM_DIST_TAG=next
          else
            NPM_DIST_TAG=latest
          fi

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION_MAJOR_MINOR="${VERSION_MAJOR}.${VERSION_MINOR}"
          {
            echo "package-name=$PACKAGE_NAME"
            echo "version=$PACKAGE_VERSION"
            echo "version-major=$VERSION_MAJOR"
            echo "version-major-minor=$VERSION_MAJOR_MINOR"
            echo "is-prerelease=$VERSION_IS_PRERELEASE"
            echo "npm-dist-tag=$NPM_DIST_TAG"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: [release-gate, docker-publish]
    if: github.event_name == 'release'
    concurrency:
      group: neo-mcp-npm-${{ needs.release-gate.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest
      - name: Download package artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-package-artifact
          path: release-artifact
      - name: Publish or verify package
        env:
          NPM_DIST_TAG: ${{ needs.release-gate.outputs.npm-dist-tag }}
          PACKAGE_NAME: ${{ needs.release-gate.outputs.package-name }}
          PACKAGE_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t package_files < <(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#package_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one package tarball, found ${#package_files[@]}." >&2
            exit 1
          fi
          PACKAGE_TARBALL="./${package_files[0]}"
          if [[ ! -f "$PACKAGE_TARBALL" ]]; then
            echo "Package tarball is not a local file: ${PACKAGE_TARBALL}" >&2
            exit 1
          fi
          LOCAL_INTEGRITY="$(node -p "require('./release-artifact/pack.json')[0].integrity")"
          set +e
          remote_lookup="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.integrity 2>&1)"
          remote_lookup_status=$?
          set -e
          if [[ "$remote_lookup_status" -eq 0 ]]; then
            REMOTE_INTEGRITY="$remote_lookup"
          elif [[ "$remote_lookup" == *"E404"* ]]; then
            REMOTE_INTEGRITY=''
          else
            echo "Unable to query npm for ${PACKAGE_NAME}@${PACKAGE_VERSION}." >&2
            echo "$remote_lookup" >&2
            exit 1
          fi

          if [[ -n "$REMOTE_INTEGRITY" ]]; then
            if [[ "$REMOTE_INTEGRITY" != "$LOCAL_INTEGRITY" ]]; then
              # npm may re-encode an otherwise identical package tarball. Compare
              # the immutable package payload before treating a retry as a conflict.
              compare_dir="$(mktemp -d)"
              trap 'rm -rf "$compare_dir"' EXIT
              mkdir -p "$compare_dir/local" "$compare_dir/remote" "$compare_dir/registry"
              remote_tarball="$compare_dir/registry/$(
                npm pack "${PACKAGE_NAME}@${PACKAGE_VERSION}" \
                  --pack-destination "$compare_dir/registry" --silent
              )"
              tar -xzf "$PACKAGE_TARBALL" -C "$compare_dir/local"
              tar -xzf "$remote_tarball" -C "$compare_dir/remote"
              if ! diff -qr --no-dereference \
                "$compare_dir/local/package" "$compare_dir/remote/package"; then
                echo "Published package payload does not match the validated artifact." >&2
                exit 1
              fi
            fi
          else
            npm publish "$PACKAGE_TARBALL" --access public --tag "$NPM_DIST_TAG"
          fi

          PUBLISHED_VERSION="$(npm view --silent "$PACKAGE_NAME" "dist-tags.${NPM_DIST_TAG}")"
          if [[ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "npm ${NPM_DIST_TAG} does not point to ${PACKAGE_NAME}@${PACKAGE_VERSION}." >&2
            exit 1
          fi

  docker-publish:
    name: Publish container candidate
    runs-on: ubuntu-latest
    needs: release-gate
    if: github.event_name == 'release'
    outputs:
      image-digest: ${{ steps.digest.outputs.digest }}
    concurrency:
      group: neo-mcp-docker-${{ needs.release-gate.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/neo-mcp
      IMAGE_VERSION: ${{ needs.release-gate.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Check existing versioned image
        id: image
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_REPOSITORY}:${IMAGE_VERSION}"
          set +e
          inspect_output="$(docker buildx imagetools inspect "$IMAGE_REF" 2>&1)"
          inspect_status=$?
          set -e
          if [[ "$inspect_status" -eq 0 ]]; then
            if ! docker pull "$IMAGE_REF"; then
              echo "Unable to pull existing image '$IMAGE_REF'." >&2
              exit 1
            fi
            actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"
            actual_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE_REF")"
            if [[ "$actual_revision" != "$EXPECTED_REVISION" || "$actual_version" != "$IMAGE_VERSION" ]]; then
              echo "Existing image tag does not match this release commit and version." >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$inspect_output" == *"manifest unknown"* || "$inspect_output" == *": not found"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to inspect existing image '$IMAGE_REF'." >&2
            echo "$inspect_output" >&2
            exit 1
          fi
      - name: Build versioned image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check versioned image health
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_REPOSITORY}:${IMAGE_VERSION}"
          container_name="neo-mcp-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          wallet_volume="${container_name}-wallets"
          cleanup() {
            exit_code=$?
            if [[ "$exit_code" -ne 0 ]]; then
              docker logs "$container_name" || true
            fi
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            docker volume rm --force "$wallet_volume" >/dev/null 2>&1 || true
            trap - EXIT
            exit "$exit_code"
          }
          trap cleanup EXIT
          docker volume create "$wallet_volume" >/dev/null
          docker run --detach --name "$container_name" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 512m \
            --cpus 1 \
            --env NEO_NETWORK=testnet \
            --env HTTP_API_KEY=ci-only-api-key-0000000000000000 \
            --volume "${wallet_volume}:/app/wallets" \
            "$IMAGE_REF"
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            [[ "$status" == healthy ]] && break
            [[ "$status" == unhealthy ]] && exit 1
            sleep 1
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container_name")" == healthy ]]
          docker exec "$container_name" node -e \
            "require('http').get('http://127.0.0.1:3000/live',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
          docker exec "$container_name" sh -c \
            'if touch /app/read-only-probe 2>/dev/null; then exit 1; fi; touch /app/wallets/write-probe; rm /app/wallets/write-probe; touch /tmp/write-probe; rm /tmp/write-probe'
      - name: Push versioned image
        if: steps.image.outputs.exists != 'true'
        run: docker push "${IMAGE_REPOSITORY}:${IMAGE_VERSION}"
      - name: Resolve immutable image digest
        id: digest
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_REPOSITORY}:${IMAGE_VERSION}"
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE_REF")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Registry returned an invalid image digest for ${IMAGE_REF}: ${digest}" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$IMAGE_REPOSITORY" "$digest" > container-image-digest.txt
      - name: Upload immutable image digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-image-digest
          path: container-image-digest.txt

  promote-release:
    name: Promote release channels
    runs-on: ubuntu-latest
    needs: [release-gate, publish, docker-publish]
    if: github.event_name == 'release'
    concurrency:
      group: neo-mcp-release-promotion
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/neo-mcp
      NPM_DIST_TAG: ${{ needs.release-gate.outputs.npm-dist-tag }}
      PACKAGE_NAME: ${{ needs.release-gate.outputs.package-name }}
      PACKAGE_VERSION: ${{ needs.release-gate.outputs.version }}
      IMAGE_DIGEST: ${{ needs.docker-publish.outputs.image-digest }}
      IS_PRERELEASE: ${{ needs.release-gate.outputs.is-prerelease }}
      VERSION_MAJOR: ${{ needs.release-gate.outputs.version-major }}
      VERSION_MAJOR_MINOR: ${{ needs.release-gate.outputs.version-major-minor }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Ensure promotion does not move backward
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${PACKAGE_VERSION}" >/dev/null

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Container candidate digest is missing or invalid." >&2
            exit 1
          fi

          if ! current_version="$(npm view --silent "$PACKAGE_NAME" "dist-tags.${NPM_DIST_TAG}")"; then
            echo "Unable to query the current npm channel." >&2
            exit 1
          fi
          current_versions=()
          if [[ -n "$current_version" ]]; then
            current_versions+=("$current_version")
          fi

          if [[ "$IS_PRERELEASE" == false ]]; then
            set +e
            docker_channel_lookup="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:latest" 2>&1)"
            docker_channel_status=$?
            set -e
            if [[ "$docker_channel_status" -eq 0 ]]; then
              docker pull "${IMAGE_REPOSITORY}:latest" >/dev/null
              docker_current_version="$(
                docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
                  "${IMAGE_REPOSITORY}:latest"
              )"
              if [[ -z "$docker_current_version" || "$docker_current_version" == '<no value>' ]]; then
                echo "Current Docker channel is missing its release version label." >&2
                exit 1
              fi
              current_versions+=("$docker_current_version")
            elif [[ "$docker_channel_lookup" != *"manifest unknown"* && "$docker_channel_lookup" != *": not found"* ]]; then
              echo "Unable to query the current Docker channel." >&2
              echo "$docker_channel_lookup" >&2
              exit 1
            fi
          fi

          for current_version in "${current_versions[@]}"; do
            CURRENT_VERSION="$current_version" CANDIDATE_VERSION="$PACKAGE_VERSION" node <<'NODE'
          const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          const parse = (value) => {
            const match = pattern.exec(value);
            if (!match) throw new Error(`Invalid semantic version: ${value}`);
            return {
              core: [BigInt(match[1]), BigInt(match[2]), BigInt(match[3])],
              prerelease: match[4]?.split('.') ?? null,
            };
          };
          const compareIdentifiers = (left, right) => {
            const leftNumeric = /^\d+$/.test(left);
            const rightNumeric = /^\d+$/.test(right);
            if (leftNumeric && rightNumeric) {
              const leftNumber = BigInt(left);
              const rightNumber = BigInt(right);
              return leftNumber < rightNumber ? -1 : leftNumber > rightNumber ? 1 : 0;
            }
            if (leftNumeric !== rightNumeric) return leftNumeric ? -1 : 1;
            return left < right ? -1 : left > right ? 1 : 0;
          };
          const compare = (leftValue, rightValue) => {
            const left = parse(leftValue);
            const right = parse(rightValue);
            for (let index = 0; index < left.core.length; index += 1) {
              if (left.core[index] < right.core[index]) return -1;
              if (left.core[index] > right.core[index]) return 1;
            }
            if (left.prerelease === null || right.prerelease === null) {
              if (left.prerelease === right.prerelease) return 0;
              return left.prerelease === null ? 1 : -1;
            }
            const length = Math.max(left.prerelease.length, right.prerelease.length);
            for (let index = 0; index < length; index += 1) {
              if (left.prerelease[index] === undefined) return -1;
              if (right.prerelease[index] === undefined) return 1;
              const result = compareIdentifiers(left.prerelease[index], right.prerelease[index]);
              if (result !== 0) return result;
            }
            return 0;
          };
          if (compare(process.env.CANDIDATE_VERSION, process.env.CURRENT_VERSION) < 0) {
            console.error(
              `Refusing to move the channel backward from ${process.env.CURRENT_VERSION} to ${process.env.CANDIDATE_VERSION}.`
            );
            process.exit(1);
          }
          NODE
          done
      - name: Promote stable Docker aliases
        if: needs.release-gate.outputs.is-prerelease == 'false'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:latest" \
            --tag "${IMAGE_REPOSITORY}:${VERSION_MAJOR_MINOR}" \
            --tag "${IMAGE_REPOSITORY}:${VERSION_MAJOR}" \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
