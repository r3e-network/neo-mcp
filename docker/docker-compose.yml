name: neo-mcp

services:
  neo-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: neo-mcp:local
    pull_policy: build
    container_name: neo-mcp-server
    restart: unless-stopped
    stop_grace_period: "${STOP_GRACE_PERIOD:-30s}"
    pids_limit: ${PIDS_LIMIT:-256}
    mem_limit: "${MEMORY_LIMIT:-512m}"
    cpus: ${CPU_LIMIT:-1.0}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,mode=1777"
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      - NEO_NETWORK=${NEO_NETWORK:-mainnet}
      - NEO_MAINNET_RPC=${NEO_MAINNET_RPC:-https://mainnet1.neo.coz.io:443}
      - NEO_TESTNET_RPC=${NEO_TESTNET_RPC:-https://testnet1.neo.coz.io:443}
      - NEO_RPC_TIMEOUT_MS=${NEO_RPC_TIMEOUT_MS:-15000}
      - NEO_ALLOW_INSECURE_RPC=${NEO_ALLOW_INSECURE_RPC:-false}
      - NEO_MAX_TRANSACTION_FEE_GAS=${NEO_MAX_TRANSACTION_FEE_GAS:-20}
      - RATE_LIMITING_ENABLED=${RATE_LIMITING_ENABLED:-true}
      - MAX_REQUESTS_PER_MINUTE=${MAX_REQUESTS_PER_MINUTE:-60}
      - MAX_REQUESTS_PER_HOUR=${MAX_REQUESTS_PER_HOUR:-1000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_CONSOLE=${LOG_CONSOLE:-true}
      - NODE_ENV=production
      - PORT=3000
      - HTTP_HOST=0.0.0.0
      - HTTP_API_KEY=${HTTP_API_KEY:?Set HTTP_API_KEY to at least 32 bytes}
      - HTTP_CORS_ORIGINS=${HTTP_CORS_ORIGINS:-}
      - HTTP_TRUSTED_PROXIES=${HTTP_TRUSTED_PROXIES:-}
      - HTTP_MAX_BODY_BYTES=${HTTP_MAX_BODY_BYTES:-1048576}
      - WALLETS_DIR=/app/wallets
    volumes:
      - neo-mcp-wallets:/app/wallets
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/live',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Remote MCP 2026-07-28 HTTP transport. Same production image as neo-mcp,
  # different entrypoint: this speaks MCP JSON-RPC, not the REST API.
  # See docs/remote-mcp-transport.md.
  neo-mcp-http:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: neo-mcp:local
    pull_policy: build
    container_name: neo-mcp-http
    command: ["node", "dist/mcp-http.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: "${STOP_GRACE_PERIOD:-30s}"
    pids_limit: ${PIDS_LIMIT:-256}
    mem_limit: "${MEMORY_LIMIT:-512m}"
    cpus: ${CPU_LIMIT:-1.0}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m,mode=1777"
    ports:
      - "${MCP_HTTP_BIND_ADDRESS:-127.0.0.1}:${MCP_HTTP_PORT:-3001}:3001"
    environment:
      - NEO_NETWORK=${NEO_NETWORK:-mainnet}
      - NEO_MAINNET_RPC=${NEO_MAINNET_RPC:-https://mainnet1.neo.coz.io:443}
      - NEO_TESTNET_RPC=${NEO_TESTNET_RPC:-https://testnet1.neo.coz.io:443}
      - NEO_RPC_TIMEOUT_MS=${NEO_RPC_TIMEOUT_MS:-15000}
      - NEO_ALLOW_INSECURE_RPC=${NEO_ALLOW_INSECURE_RPC:-false}
      - RATE_LIMITING_ENABLED=${RATE_LIMITING_ENABLED:-true}
      - MAX_REQUESTS_PER_MINUTE=${MAX_REQUESTS_PER_MINUTE:-60}
      - MAX_REQUESTS_PER_HOUR=${MAX_REQUESTS_PER_HOUR:-1000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_CONSOLE=${LOG_CONSOLE:-true}
      - NODE_ENV=production
      # The container always binds 0.0.0.0:3001; MCP_HTTP_PORT above only
      # selects the published host port.
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=3001
      - MCP_HTTP_PATH=${MCP_HTTP_PATH:-/mcp}
      # Required: the listener is not on loopback inside the container.
      - MCP_HTTP_BEARER=${MCP_HTTP_BEARER:?Set MCP_HTTP_BEARER to at least 32 bytes}
      - MCP_HTTP_ALLOWED_ORIGINS=${MCP_HTTP_ALLOWED_ORIGINS:-}
      - MCP_HTTP_MAX_CONCURRENT_REQUESTS=${MCP_HTTP_MAX_CONCURRENT_REQUESTS:-128}
      - MCP_HTTP_MAX_SUBSCRIPTIONS=${MCP_HTTP_MAX_SUBSCRIPTIONS:-128}
      - MCP_HTTP_MAX_BODY_BYTES=${MCP_HTTP_MAX_BODY_BYTES:-4194304}
      - MCP_HTTP_BODY_TIMEOUT_MS=${MCP_HTTP_BODY_TIMEOUT_MS:-30000}
      - MCP_HTTP_HEADERS_TIMEOUT_MS=${MCP_HTTP_HEADERS_TIMEOUT_MS:-30000}
      - MCP_HTTP_REQUEST_TIMEOUT_MS=${MCP_HTTP_REQUEST_TIMEOUT_MS:-300000}
      - MCP_HTTP_KEEP_ALIVE_MS=${MCP_HTTP_KEEP_ALIVE_MS:-15000}
      # Pinned: a remotely reachable MCP listener must not carry a signer.
      - NEO_ENABLE_WRITES=false
      - EXPLORER_ACCOUNT_WATCH_ENABLED=${EXPLORER_ACCOUNT_WATCH_ENABLED:-false}
      - EXPLORER_ACCOUNT_WATCH_API_URL=${EXPLORER_ACCOUNT_WATCH_API_URL:-https://www.neo3scan.com/api/account-watches}
      - EXPLORER_ACCOUNT_WATCH_API_TOKEN=${EXPLORER_ACCOUNT_WATCH_API_TOKEN:-}
      - WALLETS_DIR=/app/wallets
    volumes:
      # Dedicated volume: the remotely reachable service gets no view of the
      # REST service's wallet records.
      - neo-mcp-http-wallets:/app/wallets
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/healthz',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  neo-mcp-wallets:
    driver: local
  neo-mcp-http-wallets:
    driver: local
